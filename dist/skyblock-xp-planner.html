<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SkyBlock XP Planner</title>
<style>
:root {
  --ink: #0b0e14;
  --panel: #141821;
  --panel2: #1b2029;
  --line: #272d3a;
  --muted: #8b94a7;
  --text: #d7dce6;
  --gold: #f0c674;
  --aqua: #5fd3bc;
  --rose: #e06c75;
  color-scheme: dark;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--ink);
  color: var(--text);
  font: 14px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  font-feature-settings: "tnum" 1;
  -webkit-font-smoothing: antialiased;
}

#app { max-width: 1000px; margin: 0 auto; padding: 32px 16px 64px; }

h1 { font-size: 24px; margin: 0; letter-spacing: -0.01em; }
h3 { font-size: 14px; margin: 0 0 4px; }
.gold { color: var(--gold); }
.dim { color: var(--muted); }
.sub { color: var(--muted); font-size: 12px; margin: 4px 0; }
header .sub { margin-bottom: 20px; max-width: 70ch; }

.panel { border: 1px solid var(--line); background: var(--panel); border-radius: 8px; overflow: hidden; }
.panel + .panel { margin-top: 8px; }
.pad { padding: 16px; }

/* ------------------------------------------------------------------ controls */

.controls { margin-bottom: 20px; }
.row { display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-end; margin-bottom: 12px; }
.row:last-of-type { margin-bottom: 0; }
.row > label { flex: 1 1 180px; display: block; font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); }
.row > label > input, .row > label > select { margin-top: 4px; }
.get-key {
  display: block;
  margin-top: 3px;
  font-size: 11px;
  text-transform: none;
  letter-spacing: normal;
  color: var(--aqua);
  text-decoration: none;
  width: fit-content;
}
.get-key:hover { text-decoration: underline; }
.inline { display: flex; gap: 4px; margin-top: 4px; }
.inline > input { flex: 1; }

input, select {
  width: 100%;
  padding: 6px 9px;
  border: 1px solid var(--line);
  border-radius: 4px;
  background: var(--panel2);
  color: var(--text);
  font: inherit;
  font-size: 13px;
  text-transform: none;
  letter-spacing: normal;
}
input:focus, select:focus { outline: none; border-color: var(--aqua); }
input[type="range"] { padding: 0; accent-color: var(--aqua); background: none; border: none; }

button { font: inherit; cursor: pointer; }
button:disabled { opacity: 0.45; cursor: default; }

.primary {
  padding: 7px 18px;
  border: none;
  border-radius: 4px;
  background: var(--aqua);
  color: var(--ink);
  font-weight: 600;
  font-size: 13px;
  height: 33px;
}

.chip {
  padding: 3px 9px;
  border: 1px solid var(--line);
  border-radius: 4px;
  background: transparent;
  color: var(--muted);
  font-size: 12px;
  white-space: nowrap;
}
.chip:hover { border-color: var(--aqua); color: var(--aqua); }
.chip.on { border-color: var(--aqua); background: rgba(95, 211, 188, 0.1); color: var(--aqua); }
.chip.alert { border-color: var(--gold); color: var(--gold); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
.tabs { display: flex; gap: 6px; margin-bottom: 12px; }

/* -------------------------------------------------------------------- status */

.error, .busy, .warn, .empty {
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 10px 14px;
  margin: 0 0 12px;
  font-size: 13px;
}
.error { border-color: rgba(224, 108, 117, 0.5); color: var(--rose); }
.busy { color: var(--aqua); border-color: rgba(95, 211, 188, 0.4); }
.warn { color: var(--gold); border-color: rgba(240, 198, 116, 0.4); }
.empty { color: var(--muted); text-align: center; padding: 32px; }

.meta { display: flex; flex-wrap: wrap; gap: 6px 16px; align-items: center; margin-bottom: 14px; font-size: 13px; }

/* --------------------------------------------------------------------- stats */

.stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; margin-bottom: 12px; }
.stat { background: var(--panel); padding: 10px 14px; }
.stat-label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); }
.stat-value { font-size: 20px; font-variant-numeric: tabular-nums; }
.stat-value.gold { color: var(--gold); }
.stat-sub { font-size: 12px; color: var(--muted); }

/* -------------------------------------------------------------------- groups */

.group-head {
  display: flex;
  align-items: baseline;
  gap: 12px;
  width: 100%;
  padding: 10px 14px;
  border: none;
  background: transparent;
  color: inherit;
  text-align: left;
  font-size: 13px;
}
.group-head:hover { background: var(--panel2); }
.group-name { flex: 1; font-weight: 500; }
.group-xp { width: 90px; text-align: right; color: var(--gold); font-variant-numeric: tabular-nums; }
.group-cost { width: 190px; text-align: right; font-variant-numeric: tabular-nums; }
.group-cost .note { margin-left: 6px; }
.chev { width: 12px; color: var(--muted); text-align: center; }
.group-body { border-top: 1px solid var(--line); background: rgba(27, 32, 41, 0.4); }
.group-body .sub { padding: 4px 14px; }

.tasks { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--line); background: rgba(27, 32, 41, 0.4); }
.group-body .tasks { border-top: none; }
.task { display: flex; align-items: baseline; gap: 12px; padding: 5px 14px; font-size: 13px; border-top: 1px solid rgba(39, 45, 58, 0.6); }
.task:first-child { border-top: none; }
.task-name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.task-xp { width: 64px; text-align: right; color: var(--gold); font-variant-numeric: tabular-nums; }
.task-cost { width: 90px; text-align: right; font-variant-numeric: tabular-nums; }
.task-rate { width: 100px; text-align: right; color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
.tag, .note { margin-left: 6px; font-size: 12px; color: var(--muted); }
.count {
  margin-left: 6px;
  padding: 0 4px;
  border: 1px solid var(--line);
  border-radius: 3px;
  font-size: 11px;
  color: var(--muted);
}

.unmodelled { list-style: none; margin: 8px 0 0; padding: 0; font-size: 12px; }
.unmodelled li { margin-bottom: 5px; }
.um-name { color: var(--text); }
.um-xp { margin-left: 6px; color: rgba(240, 198, 116, 0.75); font-variant-numeric: tabular-nums; }
.unmodelled .dim { margin-left: 6px; }

.pkg-index {
  width: 22px; height: 22px; flex: none;
  display: inline-flex; align-items: center; justify-content: center;
  border: 1px solid var(--line); border-radius: 50%;
  font-size: 11px; color: var(--muted);
}
.pkg-group { border-top: 1px solid rgba(39, 45, 58, 0.6); }
.pkg-group:first-child { border-top: none; }
.pkg-group-head {
  display: flex; justify-content: space-between; gap: 12px;
  padding: 6px 14px 2px; font-size: 12px; font-weight: 500;
}
.wide { flex: 1 1 100% !important; }
.hint { margin-left: 8px; text-transform: none; letter-spacing: normal; color: rgba(139, 148, 167, 0.75); }
.bleed { width: 82px; text-align: right; font-variant-numeric: tabular-nums; color: var(--muted); font-size: 12px; }
.bleed.on { color: var(--rose); }
.bleed-note { margin: -4px 0 12px; max-width: 78ch; }

#results.stale { opacity: 0.55; transition: opacity 120ms ease; }
#results { transition: opacity 120ms ease; }

footer { margin-top: 24px; padding-top: 12px; border-top: 1px solid var(--line); font-size: 12px; color: var(--muted); }

@media (max-width: 720px) {
  .stats { grid-template-columns: repeat(2, 1fr); }
  .group-cost { width: 110px; }
  .group-cost .note { display: none; }
  .task-rate { display: none; }
  .bleed { width: 62px; }
}

.group-toggle { display: flex; align-items: center; gap: 8px; padding-top: 8px; }
.tag.cat { margin-left: 0; margin-right: 6px; padding: 0 4px; border: 1px solid var(--line); border-radius: 3px; font-size: 10px; text-transform: uppercase; letter-spacing: 0.04em; }
.group-toggle .push { margin-left: auto; }
.tag.est { margin-left: 6px; padding: 0 4px; border: 1px solid var(--line); border-radius: 3px; font-size: 10px; color: var(--gold); }

.level-mark {
  display: flex; align-items: center; gap: 10px;
  padding: 3px 14px; border-top: 1px solid rgba(39, 45, 58, 0.6);
  font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--aqua);
}
.level-mark::after { content: ""; flex: 1; height: 1px; background: rgba(95, 211, 188, 0.25); }
.level-mark span { flex: none; }
.level-mark .mark-cost { flex: none; margin-left: 8px; text-transform: none; letter-spacing: normal; color: var(--muted); font-variant-numeric: tabular-nums; }
.task-cost .net { display: block; font-size: 11px; color: var(--aqua); }

</style>
</head>

function bagUpgradeCost(data, upgrade) {

function effortOf(data, taskId) {

function magicalPowerOf(data, rarity) {

const UPGRADE_WORD = "Talisman|Ring|Artifact|Relic|Orb|Heirloom|Badge|Chronomicon";
const FAMILY_SUFFIX = new RegExp(`\\s+(${UPGRADE_WORD})$`);

const TIER_MARKER = /(\s+-\s+Tier\s+\d+|\s+\d+)$/;
function familyOf(data, name, id) {
    for (const phrase of data.accessoryFamilies.endsWithFamilies){
        if (name.endsWith(phrase)) return phrase.toLowerCase();
    }
    for (const rule of data.accessoryFamilies.patternFamilies){
        if (new RegExp(rule.match).test(name)) return rule.family;
    }
    const untiered = name.replace(TIER_MARKER, "");
    const ofMatch = FAMILY_OF.exec(untiered);
    if (ofMatch) return ofMatch[2].toLowerCase();

function scoreBag(data, items, reportedMp, capacity = 0) {
    const byId = new Map(data.accessories.accessories.map((a)=>[
            a.id,
            a
        ]));
    const excluded = new Set(data.magicalPower.excludedItems.ids);
    const familyPower = new Map();
    const familyBest = new Map();
    const owned = new Set();
    for (const item of items ?? []){
        owned.add(item.id);
        if (excluded.has(item.id)) continue;
        const meta = byId.get(item.id);
        if (!meta) continue;
        const rarity = bumpRarity(data, meta.tier, item.rarityUpgrades);
        const family = familyOf(data, meta.name, meta.id);
        const power = magicalPowerOf(data, rarity);
        if (power > (familyPower.get(family) ?? -1)) {
            familyPower.set(family, power);
            familyBest.set(family, {
                id: meta.id,
                rarity,
                recombobulated: item.rarityUpgrades > 0

    let computedMp = 0;
    for (const power of familyPower.values())computedMp += power;
    return {
        familyPower,
        familyBest,
        owned,
        computedMp,
        reportedMp,
        readable: items !== null,
        capacity,

}
function auctionNameIndex(data) {

function bestiaryFamilyOf(data, mobId) {
    const stripped = mobId.replace(/_-?\d+$/, "");
    const candidates = [
        stripped

    for (const prefix of [
        /^master_/,
        /^pest_/

        if (prefix.test(stripped)) candidates.push(stripped.replace(prefix, ""));

    const families = bestiaryFamilies(data);
    for (const candidate of candidates){
        const alias = data.bestiaryMobs.aliases[candidate];
        if (alias) return alias;
        if (families.has(candidate)) return candidate;

            ]));
        familyCache.set(data, cached);

    return cached;
}
function bestiaryTierOf(family, brackets, kills) {
    const ladder = brackets[String(family.bracket)] ?? [];
    let tier = 0;
    for(let i = 0; i < family.maxTier && i < ladder.length; i++)if (kills >= ladder[i]) tier = i + 1;
    return tier;
}
function categoryLabel(category, data) {

    if (category !== "bestiary" || !data) return label;
    return `${label} — ${data.bestiary.totals.xp.toLocaleString("en-US")} XP in all`;
}

function coins(n) {
    if (n === null || n === undefined) return "—";
    for (const [scale, suffix] of [
        [
            1e9,
            "B"
        ],
        [
            1e6,
            "M"
        ],
        [
            1e3,
            "k"
        ]
    ]){
        const scaled = n / scale;
        if (scaled >= 0.9995) {
            const digits = scaled < 10 ? suffix === "B" ? 2 : 1 : 0;
            return `${scaled.toFixed(digits)}${suffix}`;
        }
    }
    return `${Math.round(n)}`;
}
function num(n) {
    return n.toLocaleString("en-US");
}
function rate(n) {
    if (n === null) return "—";
    return `${coins(n)}/xp`;
}

function coopProgress(profile) {
    const crafted = new Set();
    const collections = new Set();
    const collected = new Map();
    for (const member of Object.values(profile.members)){
        for (const id of member.player_data?.crafted_generators ?? [])crafted.add(id);
        for (const id of member.player_data?.unlocked_coll_tiers ?? [])collections.add(id);
        for (const [item, amount] of Object.entries(member.collection ?? {})){
            if (typeof amount === "number") collected.set(item, (collected.get(item) ?? 0) + amount);
        }
    }
    return {
        craftedGenerators: [
            ...crafted
        ],
        unlockedCollectionTiers: [
            ...collections
        ],
        collected
    };

const DECORATION = /[^\x20-\x7E]/g;
const PET_LEVEL = /^\[Lvl \d+\]\s*/;
function petKey(name) {
    return `PET:${name.trim().toUpperCase().replace(/[^A-Z0-9]+/g, "_")}`;
}
function matchName(itemName, nameToId) {
    const name = itemName.replace(DECORATION, "").replace(/\s+/g, " ").trim().toLowerCase();
    const exact = nameToId.get(name);
    if (exact) return exact;
    const parts = name.split(" ");
    for(let i = 1; i < parts.length; i++){
        const tail = nameToId.get(parts.slice(i).join(" "));
        if (tail) return tail;
    }
    return null;
}
function petsFrom(index) {
    const pets = [];
    for (const [key, byTier] of Object.entries(index.prices)){
        if (!key.startsWith("PET:")) continue;
        const name = key.slice(4).replace(/_/g, " ");
        for (const rarity of Object.keys(byTier))pets.push({
            name,
            rarity
        });
    }
    return pets;
}
function createBinIndex() {
    return {
        prices: {},
        scannedAt: Date.now(),
        pages: 0,
        listings: 0
    };
}
function absorbAuctionPage(index, auctions, nameToId) {
    for (const auction of auctions){
        if (!auction.bin || !auction.item_name || !auction.tier) continue;
        const price = auction.starting_bid ?? 0;
        if (price <= 0) continue;
        const clean = auction.item_name.replace(DECORATION, "").replace(/\s+/g, " ").trim();
        const id = PET_LEVEL.test(clean) ? petKey(clean.replace(PET_LEVEL, "")) : matchName(clean, nameToId);
        if (!id) continue;
        index.listings++;
        const byTier = index.prices[id] ??= {};
        if (byTier[auction.tier] === undefined || price < byTier[auction.tier]) byTier[auction.tier] = price;
    }
    index.pages++;
}




function prettyTaskName(id) {

    return words.charAt(0).toUpperCase() + words.slice(1);
}
function addLevelTrack(input) {
    let previous = null;
    for (const level of input.levels){
        const id = `${input.idPrefix}_${level.level}`;
        input.tasks.push({
            id,
            category: input.category,
            name: `${input.label} ${level.level}`,
            xp: input.xpFor(level.level),
            requires: previous ? [
                previous
            ] : [],
            cost: {
                kind: "none"
            },
            repeatable: false
        });
        if (input.currentXp >= level.totalXp) input.done.add(id);
        previous = id;
    }
}

function buildCatalog(member, data, bag, museum = null, pets = null, garden = null, coop = null) {
    const tasks = [];
    const done = new Set();
    const skillXp = member.player_data?.experience ?? {};
    const skillLevels = {};
    for (const skill of data.skills.skills){
        const xp = skillXp[`SKILL_${skill.key}`] ?? 0;
        let current = 0;
        for (const lv of skill.levels)if (xp >= lv.totalExpRequired) current = lv.level;
        skillLevels[skill.key] = current;

        for (const lv of skill.levels){
            if (lv.xp <= 0) continue;
            const id = `skill_${skill.key}_${lv.level}`;
            tasks.push({
                id,
                category: "skills",
                name: `${skill.name} ${lv.level}`,
                xp: lv.xp,
                requires: previous ? [
                    previous

                cost: {
                    kind: "none"
                },
                repeatable: false
            });
            if (lv.level <= current) done.add(id);
            previous = id;
        }
    }
    const unlockedTiers = new Set(coop?.unlockedCollectionTiers ?? member.player_data?.unlocked_coll_tiers ?? []);
    const collectedTotals = coop?.collected ?? collectedFrom(member);
    for (const coll of data.collections.collections){
        let previous = null;
        for (const tier of coll.tiers){
            if (tier.xp <= 0) continue;
            const id = `collection_${coll.itemId}_${tier.tier}`;
            tasks.push({
                id,
                category: "collections",
                name: `${coll.name} ${tier.tier}`,
                xp: tier.xp,
                requires: previous ? [
                    previous
                ] : [],
                cost: {
                    kind: "none"
                },
                repeatable: false,
                note: `${tier.amountRequired.toLocaleString("en-US")} collected`
            });
            const have = collectedTotals.get(coll.itemId) ?? 0;
            if (unlockedTiers.has(`${coll.itemId}_${tier.tier}`) || have >= tier.amountRequired) done.add(id);
            previous = id;
        }
    }
    const crafted = new Set(coop?.craftedGenerators ?? member.player_data?.crafted_generators ?? []);
    for (const minion of data.minions.minions){
        let previous = null;

            const id = `minion_${minion.generator}_${tier.tier}`;

            const recipe = data.costs.minions[minion.generator]?.[String(tier.tier)];
            const ingredients = Array.isArray(recipe) ? recipe : recipe?.items;
            const alsoRequires = Array.isArray(recipe) ? [] : recipe?.requires ?? [];

                id,
                category: "minions",
                name: tier.name,
                xp: tier.xp,
                requires: [

                        previous

    const upgradesPurchased = member.accessory_bag_storage?.bag_upgrades_purchased ?? 0;
    const freeSlots = Math.max(bagState.capacity - bagState.used, 0);
    const nextUpgrade = upgradesPurchased + 1;
    const nextUpgradeCost = nextUpgrade <= data.bagUpgrades.maxUpgrades ? bagUpgradeCost(data, nextUpgrade) : null;
    const slotSurcharge = freeSlots > 0 || nextUpgradeCost === null ? 0 : Math.round(nextUpgradeCost / data.bagUpgrades.slotsPerUpgrade);
    const excluded = new Set(data.magicalPower.excludedItems.ids);

            a.id,

        const gain = power - alreadyHave;
        const id = `accessory_${acc.id}`;
        tasks.push({
            id,
            category: "accessory_bag",
            name: acc.name,
            xp: Math.max(gain, 0),
            exclusiveGroup: `accessory:${family}`,
            groupLevel: power,
            groupBase: alreadyHave,
            requires: [],
            cost: acc.tradeable ? {
                kind: "auction",
                itemId: acc.id,
                surcharge: (alreadyHave > 0 ? 0 : slotSurcharge) || undefined,
                sells: bagState.familyBest.get(family)?.id
            } : {
                kind: "unknown",
                note: acc.soulbound ? "Soulbound — cannot be bought" : "Not tradeable"
            },
            repeatable: false,
            note: `${acc.tier.toLowerCase()} · ${power} MP${alreadyHave > 0 ? ` (family already gives ${alreadyHave})` : ""}`

        return discreteIds.has(previous) ? [
            previous
        ] : [];

            id: task.id,

function achievableXp(tasks) {

const CACHE_PREFIX = "sbxp:";
function cacheGet(key, maxAgeMs) {

async function hypixel(path, key) {

async function resolveUuid(input) {

    if (!/^\w{1,16}$/.test(clean)) throw new ApiError(`"${input}" is not a valid username`);
    const cached = cacheGet(`uuid:${clean.toLowerCase()}`, 7 * 24 * 3600_000);
    if (cached) return cached;
    const attempts = [
        async ()=>{
            const r = await fetch(`https://api.ashcon.app/mojang/v2/user/${encodeURIComponent(clean)}`);
            if (r.status === 404) throw new ApiError(`No Minecraft account named "${clean}"`);
            if (!r.ok) throw new ApiError(`Name lookup failed (${r.status})`);
            const body = await r.json();
            return {
                uuid: body.uuid.replace(/-/g, "").toLowerCase(),
                name: body.username
            };
        },
        async ()=>{
            const r = await fetch(`https://playerdb.co/api/player/minecraft/${encodeURIComponent(clean)}`);
            if (!r.ok) throw new ApiError(`Name lookup failed (${r.status})`);
            const body = await r.json();
            const player = body.data?.player;
            if (!player) throw new ApiError(`No Minecraft account named "${clean}"`);
            return {
                uuid: player.id.replace(/-/g, "").toLowerCase(),
                name: player.username
            };
        }
    ];
    let lastError = null;
    for (const attempt of attempts){
        try {
            const result = await attempt();
            cacheSet(`uuid:${clean.toLowerCase()}`, result);
            return result;
        } catch (error) {
            lastError = error;
        }
    }
    throw lastError instanceof ApiError ? lastError : new ApiError(`Could not look up "${clean}"`);
}

        const here = dividers.filter((d)=>d.index === index);
        return row + here.map((d)=>levelMark(d.level, d.costToNext)).join("");
    }).join("");
}
function levelMark(level, costToNext = null) {
    const cost = costToNext === null ? "" : `<span class="mark-cost">${coins(costToNext)} to next</span>`;
    return `<li class="level-mark"><span>Level ${level}</span>${cost}</li>`;
}
function packageGroups(pkg, currentXp) {
    const startingXp = currentXp + pkg.cumulativeXp - pkg.xp;
    const runs = pkg.groups.map((group)=>groupTaskRuns(group.tasks));
    const flat = runs.flat();
    const marks = levelMarks(flat.map((run)=>run.xp), startingXp);
    let index = 0;
    return pkg.groups.map((group, groupIndex)=>{
        const body = runs[groupIndex].map((run)=>{
            const crossed = marks.get(index++);
            return runRow(run) + (crossed ? crossed.map((level)=>levelMark(level)).join("") : "");
        }).join("");
        return `<div class="pkg-group">
        <div class="pkg-group-head">${CATEGORY_LABELS[group.category]}
          <span class="dim">${num(group.xp)} xp · ${coins(group.coins)}</span>
        </div>
        <ul class="tasks">${body}</ul>
      </div>`;
    }).join("");
}

})();
</script>
</body>
