<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SkyBlock XP Planner</title>
<style>
:root {
  --ink: #0b0e14;
  --panel: #141821;
  --panel2: #1b2029;
  --line: #272d3a;
  --muted: #8b94a7;
  --text: #d7dce6;
  --gold: #f0c674;
  --aqua: #5fd3bc;
  --rose: #e06c75;
  color-scheme: dark;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--ink);
  color: var(--text);
  font: 14px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  font-feature-settings: "tnum" 1;
  -webkit-font-smoothing: antialiased;
}

#app { max-width: 1000px; margin: 0 auto; padding: 32px 16px 64px; }

h1 { font-size: 24px; margin: 0; letter-spacing: -0.01em; }
h3 { font-size: 14px; margin: 0 0 4px; }
.gold { color: var(--gold); }
.dim { color: var(--muted); }
.sub { color: var(--muted); font-size: 12px; margin: 4px 0; }
header .sub { margin-bottom: 20px; max-width: 70ch; }

.panel { border: 1px solid var(--line); background: var(--panel); border-radius: 8px; overflow: hidden; }
.panel + .panel { margin-top: 8px; }
.pad { padding: 16px; }

/* ------------------------------------------------------------------ controls */

.controls { margin-bottom: 20px; }
.row { display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-end; margin-bottom: 12px; }
.row:last-of-type { margin-bottom: 0; }
.row > label { flex: 1 1 180px; display: block; font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); }
.row > label > input, .row > label > select { margin-top: 4px; }
.get-key {
  display: block;
  margin-top: 3px;
  font-size: 11px;
  text-transform: none;
  letter-spacing: normal;
  color: var(--aqua);
  text-decoration: none;
  width: fit-content;
}
.get-key:hover { text-decoration: underline; }
.inline { display: flex; gap: 4px; margin-top: 4px; }
.inline > input { flex: 1; }

input, select {
  width: 100%;
  padding: 6px 9px;
  border: 1px solid var(--line);
  border-radius: 4px;
  background: var(--panel2);
  color: var(--text);
  font: inherit;
  font-size: 13px;
  text-transform: none;
  letter-spacing: normal;
}
input:focus, select:focus { outline: none; border-color: var(--aqua); }
input[type="range"] { padding: 0; accent-color: var(--aqua); background: none; border: none; }

button { font: inherit; cursor: pointer; }
button:disabled { opacity: 0.45; cursor: default; }

.primary {
  padding: 7px 18px;
  border: none;
  border-radius: 4px;
  background: var(--aqua);
  color: var(--ink);
  font-weight: 600;
  font-size: 13px;
  height: 33px;
}

.chip {
  padding: 3px 9px;
  border: 1px solid var(--line);
  border-radius: 4px;
  background: transparent;
  color: var(--muted);
  font-size: 12px;
  white-space: nowrap;
}
.chip:hover { border-color: var(--aqua); color: var(--aqua); }
.chip.on { border-color: var(--aqua); background: rgba(95, 211, 188, 0.1); color: var(--aqua); }
.chip.alert { border-color: var(--gold); color: var(--gold); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
.tabs { display: flex; gap: 6px; margin-bottom: 12px; }

/* -------------------------------------------------------------------- status */

.error, .busy, .warn, .empty {
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 10px 14px;
  margin: 0 0 12px;
  font-size: 13px;
}
.error { border-color: rgba(224, 108, 117, 0.5); color: var(--rose); }
.busy { color: var(--aqua); border-color: rgba(95, 211, 188, 0.4); }
.warn { color: var(--gold); border-color: rgba(240, 198, 116, 0.4); }
.empty { color: var(--muted); text-align: center; padding: 32px; }

.meta { display: flex; flex-wrap: wrap; gap: 6px 16px; align-items: center; margin-bottom: 14px; font-size: 13px; }

/* --------------------------------------------------------------------- stats */

.stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; margin-bottom: 12px; }
.stat { background: var(--panel); padding: 10px 14px; }
.stat-label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); }
.stat-value { font-size: 20px; font-variant-numeric: tabular-nums; }
.stat-value.gold { color: var(--gold); }
.stat-sub { font-size: 12px; color: var(--muted); }

/* -------------------------------------------------------------------- groups */

.group-head {
  display: flex;
  align-items: baseline;
  gap: 12px;
  width: 100%;
  padding: 10px 14px;
  border: none;
  background: transparent;
  color: inherit;
  text-align: left;
  font-size: 13px;
}
.group-head:hover { background: var(--panel2); }
.group-name { flex: 1; font-weight: 500; }
.group-xp { width: 90px; text-align: right; color: var(--gold); font-variant-numeric: tabular-nums; }
.group-cost { width: 190px; text-align: right; font-variant-numeric: tabular-nums; }
.group-cost .note { margin-left: 6px; }
.chev { width: 12px; color: var(--muted); text-align: center; }
.group-body { border-top: 1px solid var(--line); background: rgba(27, 32, 41, 0.4); }
.group-body .sub { padding: 4px 14px; }

.tasks { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--line); background: rgba(27, 32, 41, 0.4); }
.group-body .tasks { border-top: none; }
.task { display: flex; align-items: baseline; gap: 12px; padding: 5px 14px; font-size: 13px; border-top: 1px solid rgba(39, 45, 58, 0.6); }
.task:first-child { border-top: none; }
.task-name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.task-xp { width: 64px; text-align: right; color: var(--gold); font-variant-numeric: tabular-nums; }
.task-cost { width: 90px; text-align: right; font-variant-numeric: tabular-nums; }
.task-rate { width: 100px; text-align: right; color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
.tag, .note { margin-left: 6px; font-size: 12px; color: var(--muted); }

.unmodelled { list-style: none; margin: 8px 0 0; padding: 0; font-size: 12px; }
.unmodelled li { margin-bottom: 5px; }
.um-name { color: var(--text); }
.um-xp { margin-left: 6px; color: rgba(240, 198, 116, 0.75); font-variant-numeric: tabular-nums; }
.unmodelled .dim { margin-left: 6px; }

.pkg-index {
  width: 22px; height: 22px; flex: none;
  display: inline-flex; align-items: center; justify-content: center;
  border: 1px solid var(--line); border-radius: 50%;
  font-size: 11px; color: var(--muted);
}
.pkg-group { border-top: 1px solid rgba(39, 45, 58, 0.6); }
.pkg-group:first-child { border-top: none; }
.pkg-group-head {
  display: flex; justify-content: space-between; gap: 12px;
  padding: 6px 14px 2px; font-size: 12px; font-weight: 500;
}
.wide { flex: 1 1 100% !important; }
.hint { margin-left: 8px; text-transform: none; letter-spacing: normal; color: rgba(139, 148, 167, 0.75); }
.bleed { width: 82px; text-align: right; font-variant-numeric: tabular-nums; color: var(--muted); font-size: 12px; }
.bleed.on { color: var(--rose); }
.bleed-note { margin: -4px 0 12px; max-width: 78ch; }

#results.stale { opacity: 0.55; transition: opacity 120ms ease; }
#results { transition: opacity 120ms ease; }

footer { margin-top: 24px; padding-top: 12px; border-top: 1px solid var(--line); font-size: 12px; color: var(--muted); }

@media (max-width: 720px) {
  .stats { grid-template-columns: repeat(2, 1fr); }
  .group-cost { width: 110px; }
  .group-cost .note { display: none; }
  .task-rate { display: none; }
  .bleed { width: 62px; }
}

</style>
</head>
